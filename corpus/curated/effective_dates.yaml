# Effective-date exceptions (corpus report finding 3).
#
# Each policy document's default date is parsed from its paragraph 4.1 (src/bnm_rag/metadata/
# dates.py); Tech Requirements' "one (1) year after the date of its issuance" is computed from
# the issue date in corpus/sources.csv. This file lists only the paragraphs that start on a
# different date. Each entry gives:
#   doc_id, paras    which paragraphs (selectors: "12.1-12.4", "9.3", "16" for all of 16.x,
#                    "Appendix 12" for a whole appendix)
#   from             an ISO date, or "pending: <event>" when no date is set yet
#   items            only these sub-items of the paragraph move (the rest keep the default)
#   who              only these firms get the different date (others keep the default)
#   source, quote    the paragraph that sets the date and words copied from it; a test checks
#                    the quote appears in that chunk, so this file cannot drift from the PDF
#
# Status (in force / not yet in force / proposed) is never stored: it is computed from `kind`
# and these dates at answer time (src/bnm_rag/metadata/status.py).

- doc_id: rmit_pd
  paras: ["10.31"]
  items: "(a), (c)"
  from: 2027-09-30
  source: "10.31"
  quote: "establish stand-in processing arrangement by 30 September 2027"

