- doc_id: complaints_pd
  para_no: Appendix I
  page: 14
  text: |
    Sample flowchart for customers, headed "Are you dissatisfied with any of our products and services?" with the FSP's logo and name.
    Stage 1: Lodge a complaint. Lodge a complaint to the FSP; receive a written acknowledgment within one (1) working day. For simple cases, allow up to 5 working days to receive a response from the FSP. For complex cases, allow up to 20 working days to receive a response from the FSP (depending on the nature and complexity of the case, such as when third-party information or documentation is required).
    Stage 2: Redress, in the event of disagreement with the FSP's final decision.
    • Case falls under the Financial Markets Ombudsman Service (FMOS) jurisdiction (within monetary limit or scope): lodge at FMOS.
    • Case beyond FMOS's monetary limit: if the FSP and complainant agree for the case to be handled by FMOS, lodge at FMOS; if either disagrees, lodge at BNMLINK.
    • Case outside FMOS's scope: lodge at BNMLINK.
    If the customer disagrees with the decision by FMOS or BNMLINK: refer the case to court for civil action.
    FMOS is appointed by Bank Negara Malaysia and the Securities Commission Malaysia and offers free, independent and impartial dispute resolution services for financial consumers and investors, focusing on financial and capital market disputes involving direct financial losses. A QR code links to FMOS's monetary limit and scope.
    How to lodge a complaint: the FSP's email address, telephone number, mailing address and branch address.

- doc_id: rmit_faq
  para_no: Q65
  page: 22
  text: &key_patterns |
    Diagram: cloud key management patterns, from least to fully independent of the cloud service provider (CSP):
    • CSP managed keys: the CSP manages everything; the cloud customer uses the encrypted service with no key control.
    • CSP with customer managed keys: the key lives inside the CSP's KMS (backed by HSMs), but the cloud customer controls its policies and usage.
    • CSP with customer imported keys: the key is generated in the cloud customer's KMS (independent custodian or on premise), then a copy is securely imported into the CSP's KMS.
    • Externally managed keys: the cloud customer generates and retains keys entirely outside the CSP. During encryption or decryption operations the key may be used temporarily, but it is never stored, cached or accessible to the CSP.

