# --- The persona's own questions (plan: Who it's for) --------------------------------------

- id: g05
  question: Can we test a new product in BNM's sandbox first? What's the Green Lane, and can we use it?
  lang: en
  firm: [standard_emi]
  coverage: answered
  expected: [sandbox_pd:7.4, sandbox_pd:Appendix IV, sandbox_pd:5.2, sandbox_pd:7.6]
  also_ok: [sandbox_pd:7.1, sandbox_pd:7.7, sandbox_faq:Q11, sandbox_faq:Q1]
  must_say:
    - The Green Lane is a faster sandbox track for financial institutions with a strong track
      record in risk management, governance and compliance; it needs BNM's prior approval.
    - An approved e-money issuer counts as a financial institution under the Framework, so it may
      apply; a fintech company on its own may not.
    - Applications open twice a year, in January and in July.
    - Green Lane tests are limited to 12 months and 20,000 unique customers per solution.
  must_not_say:
    - Fintech companies can apply to the Green Lane on their own.
  tags: [applicability, faq]
  reviewed: true

- id: g06
  question: What's the deadline to report a customer data breach to BNM?
  lang: en
  firm: [standard_emi]
  coverage: answered
  expected: [mcipd_pd:11.8, mcipd_pd:11.20, mcipd_pd:11.19]
  also_ok: [mcipd_pd:11.11, mcipd_pd:11.21, mcipd_pd:11.16, mcipd_pd:11.17]
  must_say:
    - Notify BNM immediately on becoming aware of a breach that poses reputational risk, causes
      or may cause significant harm, or involves a large number of customers.
    - A large number means more than 1,000 affected customers.
    - The investigation must be completed within three months of detecting the breach.
    - For significant harm, more than 1,000 customers or a deliberate disclosure, the detailed
      investigation report goes to BNM within one working day after it is tabled to the Board.
  must_not_say:
    - A 72-hour deadline (that is not in these documents).
  tags: [threshold]
  reviewed: true

- id: g07
  question: Do we need BNM approval to raise our wallet limit to RM5,000?
  lang: en
  firm: [standard_emi]
  coverage: answered
  expected: [emoney_pd:20.8, emoney_pd:20.9]
  also_ok: [emoney_faq:Q6]
  must_say:
    - Yes. A wallet limit of RM5,000 or more needs BNM's prior written approval.
    - Below RM5,000, notify BNM at least 14 days before, unless the functionality or product
      features change (then approval is needed).
  must_not_say:
    - Notification alone is enough for RM5,000.
  tags: [threshold, faq]
  reviewed: true

