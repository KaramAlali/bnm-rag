# Golden set (Phase 1 plan, step 3): the questions the app must get right, written BEFORE
# retrieval so the retrieval comparison (step 4) and the agent (step 5) are scored honestly.
#
# Persona: a compliance or tech lead at an e-wallet or payment gateway, unless `firm` says
# otherwise. Answers are judged as of `as_of` (status depends on the date).
#
# Fields
#   id            g01…
#   question      as the user would type it (lang: en or ms; answers are in English)
#   firm          roles from corpus/curated/applicability.yaml the asker holds; [] = not said
#   coverage      answered | partial | not_covered
#   expected      chunk_ids a correct answer must cite (retrieval recall@5 is measured on these)
#   also_ok       further chunk_ids that are fine to cite
#   must_say      facts the answer must contain (checked by an LLM judge, spot-checked by hand)
#   must_not_say  claims that make the answer wrong
#   pointer       for partial / not_covered: the document that would cover it
#   tags          done (the plan's four "done" questions), draft, rmit-vs-tr, date, threshold,
#                 faq, applicability, out-of-corpus, malay, superseded
#   reviewed      set to true once Karam has checked the expected answer against the PDF
#
# A test (tests/test_golden.py) checks the format, the roles, and that every chunk_id exists.

as_of: 2026-11-07

questions:

# --- The four "done" questions (plan: What "done" means for Phase 1) -----------------------

- id: g01
  question: We're an e-wallet with RM800m a year. Which tech rules apply and when?
  lang: en
  firm: []
  coverage: answered
  expected: [techreq-psr_pd:2.4, techreq-psr_pd:4.1, techreq-psr_pd:7.1]
  also_ok: [techreq-psr_pd:2.2, techreq-psr_pd:2.5, techreq-psr_faq:Q4,
            emoney_pd:Appendix 1 / 1, emoney_pd:27.1, rmit_pd:5.2]
  must_say:
    - The Technology Requirements policy document comes into effect on 12 March 2027.
    - With RM800m a year the value is under the RM1.5 billion threshold, so the e-wallet is
      Tier-3 unless its volume is above 7 million transactions a year (then Tier-2).
    - If the e-wallet is an eligible e-money issuer (e.g. 500,000 active users or a 5% market
      share), it is Tier-1 and follows RMiT instead.
    - Until 12 March 2027 the e-Money policy document's technology paragraphs (27 to 31) apply.
  must_not_say:
    - The Technology Requirements are in force now.
    - RMiT applies to every e-wallet.
  tags: [done, rmit-vs-tr, threshold, date, superseded]
  reviewed: true

- id: g02
  question: Does our e-wallet have to share customer data under BNM's open finance rules, and from when?
  lang: en
  firm: [eligible_emi]
  coverage: answered
  expected: [open-finance_ed:Appendix 1 / 1, open-finance_ed:Appendix 2 / 1]
  also_ok: [open-finance_ed:preface, open-finance_ed:4.1, open-finance_ed:8.4]
  must_say:
    - Open finance is an exposure draft, a proposal, not a rule in force.
    - The draft proposes that an eligible EMI with a network-based e-money solution and more
      than five million active users would be a mandated FSP.
    - For such EMIs the proposed start is 1 January 2029.
  must_not_say:
    - The open finance requirements are in force or binding.
    - The e-wallet must comply from 1 January 2027.
  tags: [done, draft, threshold]
  reviewed: true

