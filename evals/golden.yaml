# --- Thresholds and who a rule applies to ---------------------------------------------------

- id: g22
  question: When does an e-wallet become an "eligible" e-money issuer, and what changes for it?
  lang: en
  firm: [standard_emi]
  coverage: answered
  expected: [emoney_pd:Appendix 1 / 1, emoney_faq:Q3, rmit_pd:5.2]
  also_ok: [emoney_faq:Q2]
  must_say:
    - At least 500,000 active users for six consecutive months, or a 5% market share of
      e-money transaction volume, value or outstanding e-money liabilities.
    - The EMI determines its own status.
    - Eligible EMIs face higher regulatory expectations, including RMiT.
  must_not_say: []
  tags: [threshold, faq, rmit-vs-tr]
  reviewed: true

- id: g23
  question: We're a non-bank merchant acquirer with 7% of the non-bank acquiring market. Does RMiT apply to us?
  lang: en
  firm: [nonbank_acquirer_major]
  coverage: answered
  expected: [rmit_pd:5.2, techreq-psr_pd:2.4, techreq-psr_pd:2.2, techreq-psr_faq:Q4]
  also_ok: [rmit_pd:2.1, rmit_pd:2.2]
  must_say:
    - Yes. A non-bank acquirer with at least 5% of non-bank merchant acquiring value or volume is
      a financial institution under RMiT (Tier-1).
    - Of the Technology Requirements only paragraph 2.2 applies (2.7, 13.3 and Appendix 10).
    - BNM notifies firms that fall under RMiT.
  must_not_say:
    - The Technology Requirements apply in full.
  tags: [threshold, rmit-vs-tr, faq]
  reviewed: true

